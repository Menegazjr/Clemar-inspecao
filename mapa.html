<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa de Obras — Clemar Engenharia</title>
<meta name="theme-color" content="#1a2940">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
<style>
:root { --blue:#0a8fe0; --blue-glow:#19b4ff; }
body { height:100dvh; overflow:hidden; }
.wrap { display:flex; flex:1; min-height:0; }
#side { width:310px; min-width:310px; background:var(--steel); color:#fff; display:flex; flex-direction:column; border-right:1px solid rgba(255,255,255,.08); }
.side-head { padding:14px; display:flex; flex-direction:column; gap:10px; border-bottom:1px solid rgba(255,255,255,.08); }
.side-head h2 { font-family:var(--font-cond); font-size:18px; letter-spacing:.5px; display:flex; justify-content:space-between; align-items:center; }
.side-head small { font-family:var(--font-mono); font-size:11px; color:var(--blue-glow); }
.inp { width:100%; padding:9px 11px; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface); font:16px var(--font); color:var(--ink); outline:none; }
.inp:focus { border-color:var(--blue); background:#fff; }
#side .inp { background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.15); color:#fff; }
#lista { flex:1; overflow:auto; padding:10px; display:flex; flex-direction:column; gap:8px; }
.item { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); border-left:4px solid var(--c); border-radius:8px; padding:10px 12px; cursor:pointer; transition:.15s; }
.item:hover, .item.on { background:rgba(25,180,255,.14); border-color:var(--blue-glow); border-left-color:var(--c); }
.item b { font-family:var(--font-cond); font-size:15px; display:block; }
.item span { font-size:12px; color:rgba(255,255,255,.6); }
.vazio { color:rgba(255,255,255,.5); font-size:13px; text-align:center; padding:24px 10px; }
#mapbox { position:relative; flex:1; min-width:0; background:#15233a; }
#map { position:absolute; inset:0; }
.btn-blue { background:var(--blue); color:#fff; } .btn-blue:hover { background:#0879c0; }
.panel { position:absolute; top:12px; right:12px; width:330px; max-height:calc(100% - 24px); overflow:auto; background:rgba(255,255,255,.97); border-radius:12px; box-shadow:0 12px 40px rgba(0,0,0,.45); padding:16px; display:none; z-index:5; }
.panel.open { display:block; }
.panel h3 { font-family:var(--font-cond); font-size:20px; color:var(--steel); padding-right:26px; }
.panel .x { position:absolute; top:8px; right:10px; background:none; border:none; font-size:22px; color:var(--ink-light); }
.tag { display:inline-block; font-family:var(--font-cond); font-size:11px; font-weight:700; padding:2px 9px; border-radius:20px; margin:8px 0; }
.meta { font-size:13px; color:var(--ink-light); margin-bottom:4px; }
.acts { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
.fld { margin-bottom:11px; position:relative; } .fld label { display:block; font-size:11px; font-weight:600; letter-spacing:1.2px; text-transform:uppercase; color:var(--ink-light); margin-bottom:3px; }
.sug { position:absolute; left:0; right:0; top:100%; background:#fff; border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--card-shadow); z-index:10; max-height:190px; overflow:auto; }
.sug div { padding:8px 10px; font-size:13px; cursor:pointer; } .sug div:hover { background:var(--surface-2); }
.hint { font-size:12px; color:var(--ink-light); background:var(--surface); border-radius:6px; padding:8px; margin-bottom:11px; }
.pin { width:22px; height:22px; cursor:pointer; }
.pin:hover { z-index:5; }
.pin .nm { position:absolute; left:50%; top:28px; transform:translateX(-50%); white-space:nowrap; font:600 12px var(--font-cond); letter-spacing:.3px; color:#fff; background:rgba(15,25,35,.88); border:1px solid var(--c); padding:2px 9px; border-radius:10px; pointer-events:none; opacity:0; transition:opacity .15s; }
.nomes.perto .pin .nm, .pin:hover .nm { opacity:1; }
.cluster { width:var(--s); height:var(--s); border-radius:50%; background:radial-gradient(circle at 35% 30%, #35b8ff, #0a6fc0); border:3px solid rgba(255,255,255,.92); color:#fff; font:700 14px var(--font-cond); display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 0 0 7px rgba(25,180,255,.25), 0 4px 14px rgba(0,0,0,.55); }
.cluster:hover { filter:brightness(1.12); }
.pin .mt { position:absolute; right:-10px; top:-10px; width:18px; height:18px; border-radius:50%; background:#fff; border:2px solid var(--c); font-style:normal; font-size:9px; line-height:14px; text-align:center; box-shadow:0 1px 4px rgba(0,0,0,.5); }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip { display:inline-flex; align-items:center; gap:6px; font:600 12px var(--font-cond); padding:3px 10px; border-radius:20px; border:1px solid rgba(255,255,255,.2); background:transparent; color:rgba(255,255,255,.45); cursor:pointer; }
.chip i { width:9px; height:9px; border-radius:50%; background:var(--c); opacity:.4; }
.chip.on { color:#fff; border-color:var(--c); background:rgba(255,255,255,.08); } .chip.on i { opacity:1; }
.chip small { opacity:.7; font-family:var(--font-mono); }
.mapbtn { position:absolute; top:10px; left:10px; z-index:6; width:34px; height:34px; border:none; border-radius:6px; background:#fff; box-shadow:0 0 0 2px rgba(0,0,0,.1); font-size:15px; cursor:pointer; color:var(--steel); }
.wrap.recolhido #side { display:none; }
.pop .maplibregl-popup-content { border-radius:12px; padding:14px 16px 12px; min-width:230px; box-shadow:0 10px 30px rgba(0,0,0,.45); }
.pop .maplibregl-popup-close-button { font-size:20px; padding:2px 8px; color:var(--ink-light); }
.dots { display:flex; align-items:center; gap:9px; padding:2px 0; }
.dot { width:22px; height:22px; border-radius:50%; border:2px solid #fff; background:var(--c); cursor:pointer; padding:0; box-shadow:0 0 8px var(--c); transition:.15s; }
.dot.on { transform:scale(1.2); box-shadow:0 0 0 3px rgba(255,255,255,.35), 0 0 10px var(--c); }
.dot.mnt { background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.5); font-size:11px; line-height:1; box-shadow:none; margin-left:auto; }
.dot.mnt.on { background:#fff; }
.dots.filtrando .dot:not(.on) { opacity:.3; }
.formbox { position:relative; width:290px; max-width:100%; max-height:55vh; overflow:auto; padding:2px 4px 0 0; }
.formbox h3 { font-family:var(--font-cond); font-size:19px; color:var(--steel); padding-right:24px; }
.formbox .x { position:absolute; top:-4px; right:0; background:none; border:none; font-size:22px; color:var(--ink-light); cursor:pointer; }
.pop h3 { font-family:var(--font-cond); font-size:19px; color:var(--steel); padding-right:20px; }
.pin i { position:absolute; inset:5px; border-radius:50%; background:var(--c); border:2px solid #fff; box-shadow:0 0 12px var(--c); }
.pin b { position:absolute; inset:0; border-radius:50%; border:2px solid var(--c); animation:pulso 2s infinite; }
@keyframes pulso { 0% { transform:scale(.5); opacity:1; } 100% { transform:scale(2.2); opacity:0; } }
#toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--steel); color:#fff; padding:10px 18px; border-radius:8px; font-size:13px; display:none; z-index:999; }
@media (max-width:700px) {
  .wrap { flex-direction:column; } #side { width:auto; min-width:0; max-height:34%; overflow:auto; } #lista { min-height:140px; }
  .panel { top:auto; bottom:0; left:0; right:0; width:auto; max-height:62%; border-radius:14px 14px 0 0; }
  .btn-hide-mobile { display:none; }
}
</style>
</head>
<body>
<div id="bannerUpdate" style="display:none;background:var(--steel);color:#fff;padding:10px 16px;align-items:center;justify-content:space-between;gap:12px;font-family:var(--font-cond);border-bottom:2px solid var(--blue)">
  <span style="font-size:14px;font-weight:600">Nova versão disponível</span>
  <button class="btn btn-blue btn-sm" onclick="aplicarAtualizacao()">🔄 Atualizar agora</button>
</div>
<nav class="topnav">
  <div class="topnav-brand">
    <div class="topnav-logo"><img src="logo-clemar.png" alt="Clemar Engenharia"></div>
    <div><div class="topnav-title">MAPA DE OBRAS</div><div class="topnav-subtitle btn-hide-mobile">Supervisórios</div></div>
  </div>
  <div class="topnav-actions">
    <button class="btn btn-blue" id="btnNova" style="display:none" onclick="novaObra()">+ <span class="btn-hide-mobile">Nova obra</span></button>
    <a class="btn btn-steel" href="index.html">Inspeções</a>
    <button class="btn btn-steel" id="btnAuth" onclick="authClick()">Entrar</button>
  </div>
</nav>

<div class="wrap">
  <aside id="side">
    <div class="side-head">
      <h2><span>Obras <small id="cont">0</small></span><button class="btn btn-steel btn-sm" onclick="carregar().then(()=>toast('Obras atualizadas'))" title="Atualizar obras" style="padding:2px 10px">↻</button></h2>
      <input class="inp" id="busca" placeholder="Buscar obra, cliente ou cidade…" oninput="renderLista()">
      <div class="chips" id="chips"></div>
      <div style="display:flex;gap:8px"><button class="btn btn-steel" onclick="verBrasil()" style="flex:1;justify-content:center">Ver Brasil</button><button class="btn btn-steel" onclick="verTudo()" style="flex:1;justify-content:center">Ver todas</button></div>
      <button class="btn btn-steel" id="btnNomes" onclick="alternarNomes()" style="justify-content:center"></button>
    </div>
    <div id="lista"></div>
  </aside>
  <div id="mapbox">
    <div id="map"></div>
    <button class="mapbtn" id="btnSide" onclick="alternarMenu()" title="Recolher menu">◀</button>


    <div id="holder" style="display:none"><div class="formbox" id="pForm">
      <button class="x" onclick="fecharForm()">×</button>
      <h3 id="fTitulo">Nova obra</h3>
      <div class="hint">Digite a cidade e escolha na lista. Depois arraste o pino ou clique no mapa para ajustar o local exato.</div>
      <div class="fld"><label>Nome da obra *</label><input class="inp" id="fNome"></div>
      <div class="fld"><label>Cliente</label><input class="inp" id="fCliente"></div>
      <div class="fld"><label>Cidade *</label><input class="inp" id="fCidade" autocomplete="off" oninput="buscarCidade()"><div class="sug" id="sug" style="display:none"></div></div>
      <div class="meta" id="fCoord" style="margin-bottom:11px;font-family:var(--font-mono);font-size:11px">Sem localização</div>
      <div class="fld"><label>Status</label>
        <select class="inp" id="fStatus"><option>Em andamento</option><option>Concluída</option><option>Planejada</option><option>Paralisada</option><option>Cliente histórico</option></select></div>
      <div class="fld"><label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink)"><input type="checkbox" id="fManut"> 🔧 Possui contrato de manutenção</label></div>
      <div class="fld"><label>Cor do pino</label>
        <select class="inp" id="fCor"><option value="">Automática (pela cor do status)</option><option value="#19b4ff">Azul</option><option value="#27ae60">Verde</option><option value="#e8a020">Âmbar</option><option value="#ff7a1a">Laranja</option><option value="#c0392b">Vermelho</option><option value="#ff5fa2">Rosa</option><option value="#b57bff">Roxo</option><option value="#ffffff">Branco</option></select></div>
      <div class="fld"><label>Link do supervisório</label><input class="inp" id="fLink" placeholder="https://…" inputmode="url"></div>
      <div class="fld"><label>Observações</label><textarea class="inp" id="fObs" rows="2"></textarea></div>
      <div class="acts"><button class="btn btn-primary" onclick="salvar()">Salvar</button><button class="btn btn-outline" onclick="fecharForm()">Cancelar</button></div>
    </div></div>
  </div>
</div>

<div class="auth-card panel" id="pLogin" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);right:auto;width:min(380px,92vw);z-index:50;bottom:auto;border-radius:12px">
  <button class="x" onclick="el('pLogin').classList.remove('open')">×</button>
  <div class="auth-title">Entrar para cadastrar obras</div>
  <div class="auth-sub">Para apenas visualizar o mapa não é preciso login.</div>
  <div id="loginErr" class="auth-error"></div>
  <div class="auth-field"><label>E-mail</label><input type="email" id="lEmail" autocomplete="email"></div>
  <div class="auth-field"><label>Senha</label><input type="password" id="lSenha" autocomplete="current-password" onkeydown="if(event.key==='Enter')fazerLogin()"></div>
  <button class="auth-btn auth-btn-primary" onclick="fazerLogin()">Entrar</button>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/supercluster@8.0.1/dist/supercluster.min.js"></script>
<script>
// Mesmo projeto Supabase do sistema de inspeção
const supa = supabase.createClient('https://vsxoeqyqhmrljfahqcsb.supabase.co', 'sb_publishable_kBVUT2phcWigWcQNY7PkAQ_xOg72_kt');
const COR = { 'Em andamento':'#2ecc71', 'Concluída':'#19b4ff', 'Planejada':'#e8a020', 'Paralisada':'#e5483a', 'Cliente histórico':'#8a96a3' };
const STATUS = Object.keys(COR);
let filtro = new Set(), soManut = false, popup = null, idx = null;
const el = id => document.getElementById(id);
const formEl = document.getElementById('pForm');
const corObra = o => o.cor || COR[o.status] || COR['Em andamento'];
const local = o => o.uf ? `${o.cidade} – ${o.uf}` : (o.pais ? `${o.cidade}, ${o.pais}` : o.cidade);
const fechaPop = () => { if (popup) { popup.remove(); popup = null; } };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let map, obras = [], marcas = {}, user = null, podeEditar = false, editId = null, draft = null, draftMarca = null, popForm = null, tGeo;

function toast(t) { const e = el('toast'); e.textContent = t; e.style.display = 'block'; setTimeout(() => e.style.display = 'none', 3000); }

// ── MAPA ──
const COR_TERRA = '#2f4561', COR_AGUA = '#15233a';
const UF_URLS = ['https://servicodados.ibge.gov.br/api/v3/malhas/paises/BR?formato=application%2Fvnd.geo%2Bjson&intrarregiao=UF&qualidade=minima',
                 'https://raw.githubusercontent.com/codeforamerica/click_that_hood/master/public/data/brazil-states.geojson'];
let ufData = null;
map = new maplibregl.Map({
  container: 'map', style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
  center: [-52, -14], zoom: 3.4, pitch: 0, maxPitch: 0, bearing: 0,
  dragRotate: false, attributionControl: { compact: true }
});
map.touchZoomRotate.disableRotation(); map.keyboard.disableRotation();   // norte sempre para cima, sem inclinação
map.addControl(new maplibregl.NavigationControl({ showCompass: false, visualizePitch: false }), 'bottom-right');
map.addControl(new maplibregl.FullscreenControl({ container: el('mapbox') }), 'bottom-right');
// Rótulos em português (países da região) e cores do mapa
const _nome = ['to-string', ['coalesce', ['get', 'name:pt'], ['get', 'name_pt'], ['get', 'name_en'], ['get', 'name']]];
const NOME_PT = ['match', _nome, 'Brazil', 'Brasil', 'Paraguay', 'Paraguai', 'Mexico', 'México', 'Colombia', 'Colômbia', 'Bolivia', 'Bolívia',
  'Ecuador', 'Equador', 'Uruguay', 'Uruguai', 'Guyana', 'Guiana', 'French Guiana', 'Guiana Francesa', 'United States of America', 'Estados Unidos',
  'United States', 'Estados Unidos', 'Panama', 'Panamá', 'Dominican Republic', 'República Dominicana', 'Atlantic Ocean', 'Oceano Atlântico',
  'Pacific Ocean', 'Oceano Pacífico', 'Caribbean Sea', 'Mar do Caribe', 'Gulf of Mexico', 'Golfo do México', _nome];
function colorir() {
  map.getStyle().layers.forEach(l => {
    try {
      if (l.type === 'background') map.setPaintProperty(l.id, 'background-color', COR_TERRA);
      else if (l.type === 'fill') map.setPaintProperty(l.id, 'fill-color', /water|ocean|sea/i.test(l.id) ? COR_AGUA : COR_TERRA);
      else if (l.type === 'symbol' && l.layout && l.layout['text-field'] && !/ref|housenumber|height|ele/i.test(JSON.stringify(l.layout['text-field'])))
        map.setLayoutProperty(l.id, 'text-field', NOME_PT);
    } catch (e) {}
  });
}
// Divisas dos estados (IBGE; se falhar, usa uma cópia no GitHub)
async function carregaUFs() {
  for (const u of UF_URLS) { try { const r = await fetch(u); if (r.ok) { ufData = await r.json(); break; } } catch (e) {} }
  try { desenhaUFs(); } catch (e) {}
}
function desenhaUFs() {
  if (!ufData || map.getSource('ufs')) return;
  const rot = map.getStyle().layers.find(l => l.type === 'symbol'), antes = rot && rot.id;
  map.addSource('ufs', { type: 'geojson', data: ufData });
  map.addLayer({ id: 'ufs-fundo', type: 'fill', source: 'ufs', paint: { 'fill-color': '#5aa9e6', 'fill-opacity': 0.10 } }, antes);
  map.addLayer({ id: 'ufs-linha', type: 'line', source: 'ufs', paint: { 'line-color': '#8fc3f0', 'line-width': ['interpolate', ['linear'], ['zoom'], 3, 0.8, 9, 2], 'line-opacity': 0.9 } }, antes);
}
map.on('style.load', () => { colorir(); try { desenhaUFs(); } catch (e) {} });
map.on('click', e => { if (popForm) setPonto(e.lngLat.lat, e.lngLat.lng); });
map.on('moveend', desenhaPinos); map.on('resize', desenhaPinos);
map.on('zoom', () => el('mapbox').classList.toggle('perto', map.getZoom() >= 6.5));
function verBrasil() { map.flyTo({ center: [-52, -14], zoom: 3.4, pitch: 0, bearing: 0, speed: .9 }); }

// ── DADOS ──
async function carregar() {
  const { data, error } = await supa.from('obras_mapa').select('*').order('nome');
  if (error) { toast('Erro ao carregar obras: ' + error.message); return; }
  obras = (data || []).map(o => o.status === 'Parada' ? { ...o, status: 'Paralisada' } : o);
  atualiza();
}
function renderPinos() {
  Object.values(marcas).forEach(m => m.remove()); marcas = {};
  idx = new Supercluster({ radius: 55, maxZoom: 12, minPoints: 2 });
  idx.load(visiveis().map(o => ({ type: 'Feature', properties: { id: o.id }, geometry: { type: 'Point', coordinates: [o.lng, o.lat] } })));
  desenhaPinos();
}
// Desenha só o que está na tela: pinos individuais ou bolhas de grupo, conforme o zoom
function desenhaPinos() {
  if (!idx) return;
  const b = map.getBounds(), z = Math.floor(map.getZoom()), novas = {};
  idx.getClusters([Math.max(-180, b.getWest() - 5), Math.max(-85, b.getSouth() - 5), Math.min(180, b.getEast() + 5), Math.min(85, b.getNorth() + 5)], z).forEach(f => {
    const key = f.properties.cluster ? 'c' + f.properties.cluster_id : f.properties.id;
    novas[key] = marcas[key] || criaMarca(f);
  });
  Object.keys(marcas).forEach(k => { if (!novas[k]) marcas[k].remove(); });
  marcas = novas;
}
function criaMarca(f) {
  const [lng, lat] = f.geometry.coordinates, p = document.createElement('div');
  if (f.properties.cluster) {
    const n = f.properties.point_count;
    p.className = 'cluster'; p.style.setProperty('--s', Math.min(60, 30 + Math.sqrt(n) * 6) + 'px'); p.textContent = n;
    p.onclick = e => { e.stopPropagation(); clicaGrupo(f); };
  } else {
    const o = obras.find(x => x.id === f.properties.id);
    p.className = 'pin'; p.style.setProperty('--c', corObra(o));
    p.innerHTML = '<i></i><b></b><span class="nm"></span>' + (o.manutencao ? '<em class="mt">🔧</em>' : '');
    p.querySelector('.nm').textContent = o.nome;
    p.onclick = e => { e.stopPropagation(); abrir(o.id); };
  }
  return new maplibregl.Marker({ element: p }).setLngLat([lng, lat]).addTo(map);
}
// Clique num grupo: aproxima até separar; se as obras estão praticamente no mesmo ponto, lista os nomes
function clicaGrupo(f) {
  const id = f.properties.cluster_id, [lng, lat] = f.geometry.coordinates, z = idx.getClusterExpansionZoom(id);
  if (z <= 12) { map.easeTo({ center: [lng, lat], zoom: z + 0.3, duration: 600 }); return; }
  fechaPop();
  const li = idx.getLeaves(id, 30).map(l => { const o = obras.find(x => x.id === l.properties.id); return `<div class="meta"><a href="#" onclick="abrir('${o.id}');return false">${esc(o.nome)}</a></div>`; }).join('');
  popup = new maplibregl.Popup({ offset: 26, className: 'pop' }).setLngLat([lng, lat]).setHTML(`<h3>${f.properties.point_count} obras aqui</h3>${li}`).addTo(map);
}
function visiveis() {
  const q = el('busca').value.toLowerCase().trim();
  return obras.filter(o => (!filtro.size || filtro.has(o.status)) && (!soManut || o.manutencao)
    && [o.nome, o.cliente, o.cidade, o.uf, o.pais].join(' ').toLowerCase().includes(q));
}
function renderChips() {
  const c = el('chips'); c.className = 'dots' + (filtro.size || soManut ? ' filtrando' : '');
  c.innerHTML = STATUS.map(st => `<button class="dot${filtro.has(st) ? ' on' : ''}" style="--c:${COR[st]}" title="${st} (${obras.filter(o => o.status === st).length})" onclick="alternaStatus('${st}')"></button>`).join('')
    + `<button class="dot mnt${soManut ? ' on' : ''}" title="Contrato de manutenção (${obras.filter(o => o.manutencao).length})" onclick="alternaManut()">🔧</button>`;
}
function alternaStatus(st) { if (filtro.has(st)) filtro.delete(st); else { filtro.add(st); toast(st); } atualiza(); }
function alternaManut() { soManut = !soManut; if (soManut) toast('Só com contrato de manutenção'); atualiza(); }
function atualiza() { fechaPop(); renderChips(); renderLista(); renderPinos(); }
function renderLista() {
  const l = visiveis();
  el('cont').textContent = l.length;
  el('lista').innerHTML = l.length ? l.map(o => `<div class="item" style="--c:${esc(corObra(o))}" onclick="abrir('${o.id}', true)"><b>${esc(o.nome)}${o.manutencao ? ' 🔧' : ''}</b><span>${esc(local(o))}${o.cliente ? ' · ' + esc(o.cliente) : ''}</span></div>`).join('')
    : '<div class="vazio">Nenhuma obra encontrada.</div>';
}
function verTudo() {
  const l = visiveis(); if (!l.length) return;
  const b = new maplibregl.LngLatBounds(); l.forEach(o => b.extend([o.lng, o.lat]));
  map.fitBounds(b, { padding: 90, maxZoom: 8, duration: 900 });
}
function alternarMenu() {
  const r = document.querySelector('.wrap').classList.toggle('recolhido');
  el('btnSide').textContent = r ? '☰' : '◀'; el('btnSide').title = r ? 'Mostrar menu' : 'Recolher menu';
  setTimeout(() => map.resize(), 60);
}
function urlSegura(u) {
  if (!u) return '';
  u = u.trim(); if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(u)) u = 'https://' + u;
  try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch (e) { return ''; }
}

// ── DETALHE ──
function abrir(id, centralizar) {
  const o = obras.find(x => x.id === id); if (!o) return;
  fecharForm(); fechaPop();
  const c = COR[o.status] || COR['Em andamento'], link = urlSegura(o.supervisorio_url);
  const html = `<h3>${esc(o.nome)}</h3>
    <span class="tag" style="background:${c}22;color:${c};border:1px solid ${c}66">${esc(o.status)}</span>${o.manutencao ? '<span class="tag" style="background:#e8a02022;color:#b57400;border:1px solid #e8a02066;margin-left:6px">🔧 Manutenção</span>' : ''}
    ${o.cliente ? `<div class="meta">🏢 ${esc(o.cliente)}</div>` : ''}
    <div class="meta">📍 ${esc(local(o))}</div>
    ${o.observacoes ? `<div class="meta" style="margin-top:8px">${esc(o.observacoes)}</div>` : ''}
    <div class="acts">${link ? `<a class="btn btn-blue" href="${esc(link)}" target="_blank" rel="noopener noreferrer">Abrir supervisório ↗</a>` : '<span class="meta">Sem supervisório cadastrado</span>'}</div>
    ${podeEditar ? `<div class="acts"><button class="btn btn-outline btn-sm" onclick="editar('${o.id}')">Editar</button><button class="btn btn-danger btn-sm" onclick="excluir('${o.id}')">Excluir</button></div>` : ''}`;
  if (centralizar) map.easeTo({ center: [o.lng, o.lat], bearing: 0, duration: 600 });   // só centraliza, sem zoom
  popup = new maplibregl.Popup({ offset: 22, maxWidth: '310px', className: 'pop' }).setLngLat([o.lng, o.lat]).setHTML(html).addTo(map);
}

// ── FORMULÁRIO ──
function novaObra() { editId = null; abrirForm({}); }
function editar(id) { editId = id; abrirForm(obras.find(o => o.id === id)); }
function abrirForm(o) {
  fechaPop();
  el('fTitulo').textContent = editId ? 'Editar obra' : 'Nova obra';
  el('fNome').value = o.nome || ''; el('fCliente').value = o.cliente || ''; el('fCidade').value = o.cidade || '';
  el('fStatus').value = o.status || 'Em andamento'; el('fCor').value = o.cor || ''; el('fManut').checked = !!o.manutencao;
  el('fLink').value = o.supervisorio_url || ''; el('fObs').value = o.observacoes || '';
  draft = { uf: o.uf || '', pais: o.pais || '', lat: o.lat ?? null, lng: o.lng ?? null };
  const c = map.getCenter(), ini = draft.lat !== null ? [draft.lng, draft.lat] : [c.lng, c.lat];   // obra nova: pino provisório no centro
  montaDraft(ini); atualizaCoord();
  map.easeTo({ center: ini, offset: [0, 170], duration: 400 });   // deixa espaço para a caixinha acima do pino
}
// Pino laranja arrastável + caixinha do formulário presa a ele
function montaDraft(ll) {
  if (draftMarca) draftMarca.remove();
  if (popForm) { el('holder').appendChild(formEl); popForm.remove(); }
  draftMarca = new maplibregl.Marker({ color: '#e8a020', draggable: true }).setLngLat(ll).addTo(map);
  draftMarca.on('drag', () => popForm && popForm.setLngLat(draftMarca.getLngLat()));
  draftMarca.on('dragend', () => { const q = draftMarca.getLngLat(); draft.lat = q.lat; draft.lng = q.lng; atualizaCoord(); popForm && popForm.setLngLat(q); });
  popForm = new maplibregl.Popup({ closeButton: false, closeOnClick: false, maxWidth: '340px', offset: 44, className: 'pop' })
    .setLngLat(ll).setDOMContent(formEl).addTo(map);
}
function fecharForm() {
  if (popForm) { el('holder').appendChild(formEl); popForm.remove(); popForm = null; }
  el('sug').style.display = 'none';
  if (draftMarca) { draftMarca.remove(); draftMarca = null; }
}
function atualizaCoord() { el('fCoord').textContent = draft && draft.lat !== null ? `📌 ${draft.lat.toFixed(5)}, ${draft.lng.toFixed(5)}` : 'Sem localização'; }
function setPonto(lat, lng, voar) {
  draft.lat = lat; draft.lng = lng; atualizaCoord();
  if (draftMarca) draftMarca.setLngLat([lng, lat]);
  if (popForm) popForm.setLngLat([lng, lat]);
  if (voar) map.flyTo({ center: [lng, lat], zoom: 9, offset: [0, 170], speed: .9 });
}
function buscarCidade() {
  clearTimeout(tGeo); const q = el('fCidade').value.trim();
  if (q.length < 3) { el('sug').style.display = 'none'; return; }
  tGeo = setTimeout(async () => {
    try {
      const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=6&countrycodes=br,py,ve,cu,mx&accept-language=pt-BR&q=' + encodeURIComponent(q));
      const l = await r.json();
      el('sug').innerHTML = l.map((x, i) => `<div data-i="${i}">${esc(x.display_name)}</div>`).join('') || '<div>Nada encontrado</div>';
      el('sug').style.display = 'block';
      el('sug').onclick = e => {
        const i = e.target.dataset.i; if (i === undefined) return;
        const x = l[i], a = x.address || {};
        el('fCidade').value = a.city || a.town || a.village || a.municipality || x.name;
        const br = (a.country_code || '') === 'br';
        draft.uf = br ? (a['ISO3166-2-lvl4'] || '').replace('BR-', '') : ''; draft.pais = br ? '' : (a.country || '');
        el('sug').style.display = 'none';
        setPonto(parseFloat(x.lat), parseFloat(x.lon), true);
      };
    } catch (e) { toast('Falha ao buscar cidade.'); }
  }, 600);
}
async function salvar() {
  const nome = el('fNome').value.trim(), cidade = el('fCidade').value.trim();
  if (!nome || !cidade) { toast('Preencha o nome e a cidade.'); return; }
  if (draft.lat === null) { toast('Escolha a cidade na lista ou clique no mapa.'); return; }
  const linkTxt = el('fLink').value.trim(), link = urlSegura(linkTxt);
  if (linkTxt && !link) { toast('Link do supervisório inválido.'); return; }
  const row = { nome, cliente: el('fCliente').value.trim(), cidade, uf: draft.uf, pais: draft.pais || '', manutencao: el('fManut').checked, lat: draft.lat, lng: draft.lng,
    status: el('fStatus').value, cor: el('fCor').value, supervisorio_url: link, observacoes: el('fObs').value.trim(), atualizado_em: new Date().toISOString() };
  const q = editId ? supa.from('obras_mapa').update(row).eq('id', editId) : supa.from('obras_mapa').insert([{ ...row, criado_por: user.email }]);
  const { error } = await q;
  if (error) { toast('Erro ao salvar: ' + error.message); return; }
  const id = editId; fecharForm(); await carregar(); toast('Obra salva!'); if (id) abrir(id);
}
async function excluir(id) {
  if (!confirm('Excluir esta obra do mapa?')) return;
  const { error } = await supa.from('obras_mapa').delete().eq('id', id);
  if (error) { toast('Erro: ' + error.message); return; }
  fechaPop(); carregar(); toast('Obra excluída.');
}

// ── LOGIN (opcional: só para cadastrar/editar) ──
async function checarSessao() {
  const { data: { session } } = await supa.auth.getSession();
  user = session?.user || null; podeEditar = false;
  if (user) {
    const { data: r } = await supa.from('usuarios').select('aprovado, role').eq('id', user.id).single();
    podeEditar = !!(r && (r.aprovado || r.role === 'admin'));
  }
  el('btnNova').style.display = podeEditar ? '' : 'none';
  el('btnAuth').textContent = user ? 'Sair' : 'Entrar';
}
function authClick() {
  if (user) { supa.auth.signOut().then(() => { fecharForm(); fechaPop(); checarSessao(); }); }
  else el('pLogin').classList.add('open');
}
async function fazerLogin() {
  const err = el('loginErr'); err.style.display = 'none';
  const { error } = await supa.auth.signInWithPassword({ email: el('lEmail').value.trim(), password: el('lSenha').value });
  if (error) { err.textContent = error.message; err.style.display = 'block'; return; }
  await checarSessao();
  if (!podeEditar) { err.textContent = 'Seu acesso ainda não foi aprovado pelo administrador.'; err.style.display = 'block'; return; }
  el('pLogin').classList.remove('open');
}

function aplicaNomes(on) {
  el('mapbox').classList.toggle('nomes', on);
  el('btnNomes').textContent = on ? 'Nomes: visíveis ao aproximar' : 'Nomes: ao passar o mouse';
  try { localStorage.setItem('mapaNomes', on ? '1' : '0'); } catch (e) {}
}
function alternarNomes() { aplicaNomes(!el('mapbox').classList.contains('nomes')); }
try { aplicaNomes(localStorage.getItem('mapaNomes') === '1'); } catch (e) { aplicaNomes(false); }

// ── ATUALIZAÇÃO DO APP (mesmo service worker da inspeção) ──
let _reg = null;
function aplicarAtualizacao() {
  el('bannerUpdate').style.display = 'none';
  if (_reg && _reg.waiting) _reg.waiting.postMessage({ type: 'SKIP_WAITING' }); else location.reload();
}
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/Clemar-inspecao/sw.js').then(reg => {
      _reg = reg;
      const mostrar = () => el('bannerUpdate').style.display = 'flex';
      if (reg.waiting) mostrar();
      reg.addEventListener('updatefound', () => {
        const n = reg.installing;
        n.addEventListener('statechange', () => { if (n.state === 'installed' && navigator.serviceWorker.controller) mostrar(); });
      });
      reg.update(); setInterval(() => reg.update(), 60000);
    }).catch(() => {});
    navigator.serviceWorker.addEventListener('controllerchange', () => location.reload());
  });
}

renderChips(); checarSessao(); carregar(); carregaUFs();
</script>
</body>
</html>
