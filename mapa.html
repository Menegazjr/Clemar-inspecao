<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa de Obras — Clemar Engenharia</title>
<meta name="theme-color" content="#1a2940">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
<style>
:root { --blue:#0a8fe0; --blue-glow:#19b4ff; }
body { height:100dvh; overflow:hidden; }
.wrap { display:flex; flex:1; min-height:0; }
#side { width:310px; min-width:310px; background:var(--steel); color:#fff; display:flex; flex-direction:column; border-right:1px solid rgba(255,255,255,.08); }
.side-head { padding:14px; display:flex; flex-direction:column; gap:10px; border-bottom:1px solid rgba(255,255,255,.08); }
.side-head h2 { font-family:var(--font-cond); font-size:18px; letter-spacing:.5px; display:flex; justify-content:space-between; align-items:center; }
.side-head small { font-family:var(--font-mono); font-size:11px; color:var(--blue-glow); }
.inp { width:100%; padding:9px 11px; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface); font:16px var(--font); color:var(--ink); outline:none; }
.inp:focus { border-color:var(--blue); background:#fff; }
#side .inp { background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.15); color:#fff; }
#lista { flex:1; overflow:auto; padding:10px; display:flex; flex-direction:column; gap:8px; }
.item { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); border-left:4px solid var(--c); border-radius:8px; padding:10px 12px; cursor:pointer; transition:.15s; }
.item:hover, .item.on { background:rgba(25,180,255,.14); border-color:var(--blue-glow); border-left-color:var(--c); }
.item b { font-family:var(--font-cond); font-size:15px; display:block; }
.item span { font-size:12px; color:rgba(255,255,255,.6); }
.vazio { color:rgba(255,255,255,.5); font-size:13px; text-align:center; padding:24px 10px; }
#mapbox { position:relative; flex:1; min-width:0; background:#0b1118; }
#map { position:absolute; inset:0; }
.btn-blue { background:var(--blue); color:#fff; } .btn-blue:hover { background:#0879c0; }
.panel { position:absolute; top:12px; right:12px; width:330px; max-height:calc(100% - 24px); overflow:auto; background:rgba(255,255,255,.97); border-radius:12px; box-shadow:0 12px 40px rgba(0,0,0,.45); padding:16px; display:none; z-index:5; }
.panel.open { display:block; }
.panel h3 { font-family:var(--font-cond); font-size:20px; color:var(--steel); padding-right:26px; }
.panel .x { position:absolute; top:8px; right:10px; background:none; border:none; font-size:22px; color:var(--ink-light); }
.tag { display:inline-block; font-family:var(--font-cond); font-size:11px; font-weight:700; padding:2px 9px; border-radius:20px; margin:8px 0; }
.meta { font-size:13px; color:var(--ink-light); margin-bottom:4px; }
.acts { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
.fld { margin-bottom:11px; position:relative; } .fld label { display:block; font-size:11px; font-weight:600; letter-spacing:1.2px; text-transform:uppercase; color:var(--ink-light); margin-bottom:3px; }
.sug { position:absolute; left:0; right:0; top:100%; background:#fff; border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--card-shadow); z-index:10; max-height:190px; overflow:auto; }
.sug div { padding:8px 10px; font-size:13px; cursor:pointer; } .sug div:hover { background:var(--surface-2); }
.hint { font-size:12px; color:var(--ink-light); background:var(--surface); border-radius:6px; padding:8px; margin-bottom:11px; }
.pin { width:22px; height:22px; cursor:pointer; }
.pin:hover { z-index:5; }
.pin .nm { position:absolute; left:50%; top:28px; transform:translateX(-50%); white-space:nowrap; font:600 12px var(--font-cond); letter-spacing:.3px; color:#fff; background:rgba(15,25,35,.88); border:1px solid var(--c); padding:2px 9px; border-radius:10px; pointer-events:none; opacity:0; transition:opacity .15s; }
.nomes .pin .nm, .pin:hover .nm { opacity:1; }
.pin i { position:absolute; inset:5px; border-radius:50%; background:var(--c); border:2px solid #fff; box-shadow:0 0 12px var(--c); }
.pin b { position:absolute; inset:0; border-radius:50%; border:2px solid var(--c); animation:pulso 2s infinite; }
@keyframes pulso { 0% { transform:scale(.5); opacity:1; } 100% { transform:scale(2.2); opacity:0; } }
#toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--steel); color:#fff; padding:10px 18px; border-radius:8px; font-size:13px; display:none; z-index:999; }
@media (max-width:700px) {
  .wrap { flex-direction:column; } #side { width:auto; min-width:0; max-height:34%; }
  .panel { top:auto; bottom:0; left:0; right:0; width:auto; max-height:62%; border-radius:14px 14px 0 0; }
  .btn-hide-mobile { display:none; }
}
</style>
</head>
<body>
<nav class="topnav">
  <div class="topnav-brand">
    <div class="topnav-logo"><img src="logo-clemar.png" alt="Clemar Engenharia"></div>
    <div><div class="topnav-title">MAPA DE OBRAS</div><div class="topnav-subtitle btn-hide-mobile">Supervisórios</div></div>
  </div>
  <div class="topnav-actions">
    <button class="btn btn-blue" id="btnNova" style="display:none" onclick="novaObra()">+ <span class="btn-hide-mobile">Nova obra</span></button>
    <a class="btn btn-steel" href="index.html">Inspeções</a>
    <button class="btn btn-steel" id="btnAuth" onclick="authClick()">Entrar</button>
  </div>
</nav>

<div class="wrap">
  <aside id="side">
    <div class="side-head">
      <h2>Obras <small id="cont">0</small></h2>
      <input class="inp" id="busca" placeholder="Buscar obra, cliente ou cidade…" oninput="renderLista()">
      <button class="btn btn-steel" onclick="verBrasil()" style="justify-content:center">Ver Brasil</button>
      <button class="btn btn-steel" id="btnNomes" onclick="alternarNomes()" style="justify-content:center"></button>
    </div>
    <div id="lista"></div>
  </aside>
  <div id="mapbox">
    <div id="map"></div>

    <div class="panel" id="pDet"></div>

    <div class="panel" id="pForm">
      <button class="x" onclick="fecharForm()">×</button>
      <h3 id="fTitulo">Nova obra</h3>
      <div class="hint">Digite a cidade e escolha na lista. Depois arraste o pino ou clique no mapa para ajustar o local exato.</div>
      <div class="fld"><label>Nome da obra *</label><input class="inp" id="fNome"></div>
      <div class="fld"><label>Cliente</label><input class="inp" id="fCliente"></div>
      <div class="fld"><label>Cidade *</label><input class="inp" id="fCidade" autocomplete="off" oninput="buscarCidade()"><div class="sug" id="sug" style="display:none"></div></div>
      <div class="meta" id="fCoord" style="margin-bottom:11px;font-family:var(--font-mono);font-size:11px">Sem localização</div>
      <div class="fld"><label>Status</label>
        <select class="inp" id="fStatus"><option>Em andamento</option><option>Planejada</option><option>Concluída</option><option>Parada</option></select></div>
      <div class="fld"><label>Cor do pino</label>
        <select class="inp" id="fCor"><option value="">Automática (pela cor do status)</option><option value="#19b4ff">Azul</option><option value="#27ae60">Verde</option><option value="#e8a020">Âmbar</option><option value="#ff7a1a">Laranja</option><option value="#c0392b">Vermelho</option><option value="#ff5fa2">Rosa</option><option value="#b57bff">Roxo</option><option value="#ffffff">Branco</option></select></div>
      <div class="fld"><label>Link do supervisório</label><input class="inp" id="fLink" placeholder="https://…" inputmode="url"></div>
      <div class="fld"><label>Observações</label><textarea class="inp" id="fObs" rows="2"></textarea></div>
      <div class="acts"><button class="btn btn-primary" onclick="salvar()">Salvar</button><button class="btn btn-outline" onclick="fecharForm()">Cancelar</button></div>
    </div>
  </div>
</div>

<div class="auth-card panel" id="pLogin" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);right:auto;width:min(380px,92vw);z-index:50;bottom:auto;border-radius:12px">
  <button class="x" onclick="el('pLogin').classList.remove('open')">×</button>
  <div class="auth-title">Entrar para cadastrar obras</div>
  <div class="auth-sub">Para apenas visualizar o mapa não é preciso login.</div>
  <div id="loginErr" class="auth-error"></div>
  <div class="auth-field"><label>E-mail</label><input type="email" id="lEmail" autocomplete="email"></div>
  <div class="auth-field"><label>Senha</label><input type="password" id="lSenha" autocomplete="current-password" onkeydown="if(event.key==='Enter')fazerLogin()"></div>
  <button class="auth-btn auth-btn-primary" onclick="fazerLogin()">Entrar</button>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script>
// Mesmo projeto Supabase do sistema de inspeção
const supa = supabase.createClient('https://vsxoeqyqhmrljfahqcsb.supabase.co', 'sb_publishable_kBVUT2phcWigWcQNY7PkAQ_xOg72_kt');
const COR = { 'Em andamento':'#19b4ff', 'Concluída':'#27ae60', 'Parada':'#c0392b', 'Planejada':'#e8a020' };
const el = id => document.getElementById(id);
const corObra = o => o.cor || COR[o.status] || COR['Em andamento'];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let map, obras = [], marcas = {}, user = null, podeEditar = false, editId = null, draft = null, draftMarca = null, tGeo;

function toast(t) { const e = el('toast'); e.textContent = t; e.style.display = 'block'; setTimeout(() => e.style.display = 'none', 3000); }

// ── MAPA ──
map = new maplibregl.Map({
  container: 'map', style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
  center: [-52, -14], zoom: 3.4, pitch: 30, maxPitch: 75, attributionControl: { compact: true }
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-right');
map.on('style.load', () => { try { map.setProjection({ type: 'globe' }); } catch (e) {} });
map.on('click', e => { if (el('pForm').classList.contains('open')) setPonto(e.lngLat.lat, e.lngLat.lng); });
function verBrasil() { map.flyTo({ center: [-52, -14], zoom: 3.4, pitch: 30, bearing: 0, speed: .9 }); }

// ── DADOS ──
async function carregar() {
  const { data, error } = await supa.from('obras_mapa').select('*').order('nome');
  if (error) { toast('Erro ao carregar obras: ' + error.message); return; }
  obras = data || [];
  renderLista(); renderPinos();
}
function renderPinos() {
  Object.values(marcas).forEach(m => m.remove()); marcas = {};
  obras.forEach(o => {
    const p = document.createElement('div'); p.className = 'pin';
    p.style.setProperty('--c', corObra(o));
    p.innerHTML = '<i></i><b></b><span class="nm"></span>';
    p.querySelector('.nm').textContent = o.nome;
    p.onclick = e => { e.stopPropagation(); abrir(o.id); };
    marcas[o.id] = new maplibregl.Marker({ element: p }).setLngLat([o.lng, o.lat]).addTo(map);
  });
}
function renderLista() {
  const q = el('busca').value.toLowerCase().trim();
  const l = obras.filter(o => [o.nome, o.cliente, o.cidade, o.uf].join(' ').toLowerCase().includes(q));
  el('cont').textContent = obras.length;
  el('lista').innerHTML = l.length ? l.map(o => `<div class="item" style="--c:${esc(corObra(o))}" onclick="abrir('${o.id}')"><b>${esc(o.nome)}</b><span>${esc(o.cidade)}${o.uf ? ' – ' + esc(o.uf) : ''}${o.cliente ? ' · ' + esc(o.cliente) : ''}</span></div>`).join('')
    : '<div class="vazio">Nenhuma obra encontrada.</div>';
}
function urlSegura(u) {
  if (!u) return '';
  u = u.trim(); if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(u)) u = 'https://' + u;
  try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch (e) { return ''; }
}

// ── DETALHE ──
function abrir(id) {
  const o = obras.find(x => x.id === id); if (!o) return;
  fecharForm();
  const c = COR[o.status] || COR['Em andamento'], link = urlSegura(o.supervisorio_url);
  el('pDet').innerHTML = `<button class="x" onclick="el('pDet').classList.remove('open')">×</button>
    <h3>${esc(o.nome)}</h3>
    <span class="tag" style="background:${c}22;color:${c};border:1px solid ${c}66">${esc(o.status)}</span>
    ${o.cliente ? `<div class="meta">🏢 ${esc(o.cliente)}</div>` : ''}
    <div class="meta">📍 ${esc(o.cidade)}${o.uf ? ' – ' + esc(o.uf) : ''}</div>
    ${o.observacoes ? `<div class="meta" style="margin-top:8px">${esc(o.observacoes)}</div>` : ''}
    <div class="acts">${link ? `<a class="btn btn-blue" href="${esc(link)}" target="_blank" rel="noopener noreferrer">Abrir supervisório ↗</a>` : '<span class="meta">Sem supervisório cadastrado</span>'}</div>
    ${podeEditar ? `<div class="acts"><button class="btn btn-outline btn-sm" onclick="editar('${o.id}')">Editar</button><button class="btn btn-danger btn-sm" onclick="excluir('${o.id}')">Excluir</button></div>` : ''}`;
  el('pDet').classList.add('open');
  map.flyTo({ center: [o.lng, o.lat], zoom: 10, pitch: 55, bearing: -15, speed: .8 });
}

// ── FORMULÁRIO ──
function novaObra() { editId = null; abrirForm({}); }
function editar(id) { editId = id; abrirForm(obras.find(o => o.id === id)); }
function abrirForm(o) {
  el('pDet').classList.remove('open');
  el('fTitulo').textContent = editId ? 'Editar obra' : 'Nova obra';
  el('fNome').value = o.nome || ''; el('fCliente').value = o.cliente || ''; el('fCidade').value = o.cidade || '';
  el('fStatus').value = o.status || 'Em andamento'; el('fCor').value = o.cor || ''; el('fLink').value = o.supervisorio_url || ''; el('fObs').value = o.observacoes || '';
  draft = { uf: o.uf || '', lat: o.lat ?? null, lng: o.lng ?? null };
  if (draft.lat !== null) setPonto(draft.lat, draft.lng, true); else atualizaCoord();
  el('pForm').classList.add('open');
}
function fecharForm() {
  el('pForm').classList.remove('open'); el('sug').style.display = 'none';
  if (draftMarca) { draftMarca.remove(); draftMarca = null; }
}
function atualizaCoord() { el('fCoord').textContent = draft && draft.lat !== null ? `📌 ${draft.lat.toFixed(5)}, ${draft.lng.toFixed(5)}` : 'Sem localização'; }
function setPonto(lat, lng, voar) {
  draft.lat = lat; draft.lng = lng; atualizaCoord();
  if (!draftMarca) {
    draftMarca = new maplibregl.Marker({ color: '#e8a020', draggable: true }).setLngLat([lng, lat]).addTo(map);
    draftMarca.on('dragend', () => { const p = draftMarca.getLngLat(); draft.lat = p.lat; draft.lng = p.lng; atualizaCoord(); });
  } else draftMarca.setLngLat([lng, lat]);
  if (voar) map.flyTo({ center: [lng, lat], zoom: 9, pitch: 45, speed: .9 });
}
function buscarCidade() {
  clearTimeout(tGeo); const q = el('fCidade').value.trim();
  if (q.length < 3) { el('sug').style.display = 'none'; return; }
  tGeo = setTimeout(async () => {
    try {
      const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=6&countrycodes=br&accept-language=pt-BR&q=' + encodeURIComponent(q));
      const l = await r.json();
      el('sug').innerHTML = l.map((x, i) => `<div data-i="${i}">${esc(x.display_name)}</div>`).join('') || '<div>Nada encontrado</div>';
      el('sug').style.display = 'block';
      el('sug').onclick = e => {
        const i = e.target.dataset.i; if (i === undefined) return;
        const x = l[i], a = x.address || {};
        el('fCidade').value = a.city || a.town || a.village || a.municipality || x.name;
        draft.uf = (a['ISO3166-2-lvl4'] || '').replace('BR-', '');
        el('sug').style.display = 'none';
        setPonto(parseFloat(x.lat), parseFloat(x.lon), true);
      };
    } catch (e) { toast('Falha ao buscar cidade.'); }
  }, 600);
}
async function salvar() {
  const nome = el('fNome').value.trim(), cidade = el('fCidade').value.trim();
  if (!nome || !cidade) { toast('Preencha o nome e a cidade.'); return; }
  if (draft.lat === null) { toast('Escolha a cidade na lista ou clique no mapa.'); return; }
  const linkTxt = el('fLink').value.trim(), link = urlSegura(linkTxt);
  if (linkTxt && !link) { toast('Link do supervisório inválido.'); return; }
  const row = { nome, cliente: el('fCliente').value.trim(), cidade, uf: draft.uf, lat: draft.lat, lng: draft.lng,
    status: el('fStatus').value, cor: el('fCor').value, supervisorio_url: link, observacoes: el('fObs').value.trim(), atualizado_em: new Date().toISOString() };
  const q = editId ? supa.from('obras_mapa').update(row).eq('id', editId) : supa.from('obras_mapa').insert([{ ...row, criado_por: user.email }]);
  const { error } = await q;
  if (error) { toast('Erro ao salvar: ' + error.message); return; }
  const id = editId; fecharForm(); await carregar(); toast('Obra salva!'); if (id) abrir(id);
}
async function excluir(id) {
  if (!confirm('Excluir esta obra do mapa?')) return;
  const { error } = await supa.from('obras_mapa').delete().eq('id', id);
  if (error) { toast('Erro: ' + error.message); return; }
  el('pDet').classList.remove('open'); carregar(); toast('Obra excluída.');
}

// ── LOGIN (opcional: só para cadastrar/editar) ──
async function checarSessao() {
  const { data: { session } } = await supa.auth.getSession();
  user = session?.user || null; podeEditar = false;
  if (user) {
    const { data: r } = await supa.from('usuarios').select('aprovado, role').eq('id', user.id).single();
    podeEditar = !!(r && (r.aprovado || r.role === 'admin'));
  }
  el('btnNova').style.display = podeEditar ? '' : 'none';
  el('btnAuth').textContent = user ? 'Sair' : 'Entrar';
}
function authClick() {
  if (user) { supa.auth.signOut().then(() => { fecharForm(); el('pDet').classList.remove('open'); checarSessao(); }); }
  else el('pLogin').classList.add('open');
}
async function fazerLogin() {
  const err = el('loginErr'); err.style.display = 'none';
  const { error } = await supa.auth.signInWithPassword({ email: el('lEmail').value.trim(), password: el('lSenha').value });
  if (error) { err.textContent = error.message; err.style.display = 'block'; return; }
  await checarSessao();
  if (!podeEditar) { err.textContent = 'Seu acesso ainda não foi aprovado pelo administrador.'; err.style.display = 'block'; return; }
  el('pLogin').classList.remove('open');
}

function aplicaNomes(on) {
  el('mapbox').classList.toggle('nomes', on);
  el('btnNomes').textContent = on ? 'Nomes: sempre visíveis' : 'Nomes: ao passar o mouse';
  try { localStorage.setItem('mapaNomes', on ? '1' : '0'); } catch (e) {}
}
function alternarNomes() { aplicaNomes(!el('mapbox').classList.contains('nomes')); }
try { aplicaNomes(localStorage.getItem('mapaNomes') === '1'); } catch (e) { aplicaNomes(false); }

checarSessao(); carregar();
</script>
</body>
</html>
